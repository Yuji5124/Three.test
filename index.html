<!doctype html>
<html lang="ja">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9e1d3"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2355634d'/%3E%3Ctext x='9' y='23' fill='%23f5efe2' font-size='21'%3EC%3C/text%3E%3C/svg%3E"><title>静かな中庭 · Courtyard</title>  <script type="module" crossorigin src="/Three.test/assets/index-C3IbIlkk.js"></script>
  <link rel="stylesheet" crossorigin href="/Three.test/assets/index-BOo9zj7l.css">
</head>
  <body>
    <canvas id="scene" aria-label="人物を操作できる中庭"></canvas>
    <header><span class="mark">C / 01</span><div><h1>静かな中庭</h1><p>THE AFTERNOON COURTYARD</p></div></header>
    <div id="loading" role="status">中庭を準備しています…</div>
    <button id="settings-toggle" aria-label="設定を開く" aria-expanded="false">設定</button>
    <section id="settings" hidden>
      <h2>視点と画質</h2>
      <label>品質<select id="quality"><option value="high">高 · PC</option><option value="balanced">標準</option><option value="mobile">軽量 · モバイル</option></select></label>
      <label>カメラ距離<input id="distance" type="range" min="1.6" max="6" step="0.1" value="3.6"></label>
      <button id="reset">入口に戻る</button>
      <label class="check"><input id="diagnostics" type="checkbox">計測を表示</label>
      <p>WASD：移動 / Shift：走る<br>ドラッグ：視点 / ダブルクリック：マウス固定<br>Esc：マウス解除・停止<br>タッチ：左で移動、右で視点</p>
      <p class="note">人物・素材の詳細と測定条件はプロジェクトの文書に記載しています。</p>
    </section>
    <footer><span>WASD <i>移動</i>　 SHIFT <i>走る</i>　 DRAG <i>見回す</i></span><span class="place">24 × 24 m · SOUTH COURT</span></footer>
    <pre id="stats" hidden></pre>
    <div id="joystick"><div id="stick"></div></div><button id="touch-run">走る</button>
    <div id="error" hidden role="alert"></div>
  </body>
</html>
